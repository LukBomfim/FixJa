<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixJá - Autenticação</title>
  <link rel="stylesheet" href="../css/login_cadastro.css">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      
      <div class="auth-header">
        <h1 class="logo">Fix<span>Já</span></h1>
        <p class="subtitle">Sua plataforma rápida de serviços</p>
      </div>

      <!-- abas -->
      <input type="radio" name="auth_tab" id="tab-login-check" checked class="tab-toggle">
      <input type="radio" name="auth_tab" id="tab-register-check" class="tab-toggle">

      <div class="tab-nav">
        <label for="tab-login-check" class="tab-btn">Entrar</label>
        <label for="tab-register-check" class="tab-btn">Criar Conta</label>
      </div>


      <!-- login -->
      <form class="auth-form form-login">
        <h2>Bem-vindo!</h2>

        <div class="input-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>

        <div class="input-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Entrar no FixJá</button>
      </form>
      

      <!-- cadastro -->
      <form class="auth-form form-register">
        <h2>Crie sua conta</h2>

        <!-- opção de tipo de usuário -->
        <div class="user-type-wrapper">
          <p class="type-title">Como você quer usar o FixJá?</p>

          <div class="radio-group">
            <input type="radio" name="user_type" value="cliente" id="type-cliente" checked>
            <label for="type-cliente" class="radio-tile">
              <span>Quero Contratar</span>
            </label>

            <input type="radio" name="user_type" value="prestador" id="type-prestador">
            <label for="type-prestador" class="radio-tile">
              <span>Quero Trabalhar</span>
            </label>



            <!-- opção do prestador -->
            <div class="prestador-section">
              <div class="prestador-header">
                <h3>Perfil Profissional 🛠️</h3>
              </div>

              <div class="input-group">
                <label for="reg-category">Sua Categoria Principal</label>
                <select id="reg-category">
                  <option value="">Selecione sua profissão...</option>
                  <option value="eletricista">Eletricista</option>
                  <option value="marceneiro">Marceneiro</option>
                  <option value="encanador">Encanador</option>
                  <option value="pedreiro">Pedreiro</option>
                  <option value="pintor">Pintor</option>
                  <option value="jardineiro">Jardineiro</option>
                  <option value="cabeleireira">Cabeleireiro(a) / Barbeiro</option>
                  <option value="outros">Outros Serviços</option>
                </select>
              </div>

              <div class="input-group">
                <label for="reg-bio">Resumo do Trabalho</label>
                <textarea id="reg-bio" rows="3" placeholder="Ex: Faço instalações elétricas residenciais..."></textarea>
              </div>
            </div>
          </div>
        </div>


        
        <!-- Dados do Usuário -->
        <div class="input-group">
          <label for="reg-name">Nome Completo</label>
          <input type="text" id="reg-name" required placeholder="Ex: Maria Silva">
        </div>

        <div class="input-group">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </div>

        <div class="input-group">
          <label for="reg-password">Senha</label>
          <input type="password" id="reg-password" required placeholder="Crie uma senha forte">
        </div>

        <button type="submit" class="btn-submit">Finalizar Cadastro</button>
      </form>

    </div>
  </main>

<script src="../js/script.js"></script>

</body>
</html>
